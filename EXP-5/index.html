<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>HTML with CSS Example</title>
 <link rel="stylesheet" href="style.css">
 <style>
 /* Document-level CSS for images */
 img { border: 15px solid red; }
 </style>
</head>
<body>
 <!-- Inline CSS for headings -->
 <h1 style="font-size:12pt; font-style:italic; font-family:Verdana; 
color:blue; text-align:center;">
 Welcome to Front End Application Development
 </h1>
 <h1 style="font-size:12pt; font-style:italic; font-family:Verdana; 
color:green; text-align:center;">
 The future belongs to those who believe in the beauty of their 
dreams
 </h1>
 <div style="text-align:center; margin:16px 0;">
 <img src="person1.jpg" width="300" height="300" 
alt="Image 1">
 <img src="person2.jpg" width="300" height="300" 
alt="Image 2">
 </div>
 <div style="text-align:center;">
 <input type="button" value="Button 1" class="hover-button">
 <input type="button" value="Button 2" class="hover-button">
 </div>
</body>
</html>
