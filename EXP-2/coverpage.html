<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Book Catalog</title>
 <style>
 body { font-family: Arial, sans-serif; background-color:#ffffff; 
padding: 20px; }
 h1 { text-align: center; color: #190665; opacity: 0.9;}
 table { width: 100%; border-collapse: collapse; background-color: #ede7e7; box-shadow: 0 0 50px rgba(0,0,0,0.6); }
 th, td { padding: 15px; text-align: center; border: 1px solid 
#8784ab; }
 th { background-color: #d00e0e; color: #fff; }
 img { width: 100px; height: auto; }
 .add-cart-btn { background-color: #4b24c2; color: #fff; border:none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
 .add-cart-btn:hover { background-color: #040c30; }
 </style>
</head>
<body>
 <h1>Book Catalog</h1>
 <table>
 <tr>
 <th>Cover Page</th>
 <th>Author Name</th>
 <th>Publisher</th>
 <th>Price</th>
 <th>Add to Cart</th>
 </tr>
 <tr>
 <td><img src="Robbins.png" alt="Book 1 Cover"></td>
 <td>Robbins</td>
 <td>O'Reilly Media</td>
 <td>₹2,700</td>
 <td><button class="add-cart-btn">Add to Cart</button></td>
 </tr>
 <tr>
 <td><img src="Benfrain.png" alt="Book 2 Cover"></td>
 <td>Ben Frain</td>
 <td>Packt Publishing</td>
 <td>₹2,300</td>
 <td><button class="add-cart-btn">Add to Cart</button></td>
 </tr>
 <tr>
 <td><img src="Thomas.png" alt="Book 3 Cover"></td>
 <td>Thomas</td>
 <td>LMN Books</td>
 <td>₹2,899</td>
 <td><button class="add-cart-btn">Add to Cart</button></td>
 </tr>
 </table>
</body>
</html>
