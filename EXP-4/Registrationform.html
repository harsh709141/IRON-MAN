<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>Student Registration Form</title>
 <style>
 body { font-family: Arial, sans-serif; background: #f5f5f5; 
display: flex; justify-content: center; padding: 30px; }
 form { background: #fff; padding: 25px; border-radius: 10px; 
box-shadow: 0px 0px 10px rgba(0,0,0,.2); width: 420px; }
 h2 { text-align: center; color: #333; }
 label { display: block; margin: 10px 0 5px; font-weight: bold; }
 input, select, textarea, button { width: 100%; padding: 8px; 
margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; }
 input[type="radio"], input[type="checkbox"] { width: auto; }
 .row { display:flex; gap:10px; }
 .row > div { flex:1; }
 .inline { display:flex; gap:10px; align-items:center; }
 button { background: #007bff; color: white; font-size: 16px; 
border: none; cursor: pointer; }
 button:hover { background: #0056b3; }
 </style>
</head>
<body>
 <form action="#" method="post" enctype="multipart/form-data">
 <h2>Student Registration Form</h2>
 <label for="fullname">Full Name:</label>
 <input type="text" id="fullname" name="fullname" 
placeholder="Enter your full name" required>
 <div class="row">
 <div>
 <label for="email">Email Address:</label>
 <input type="email" id="email" name="email" 
placeholder="Enter your email" required>
 </div>
 <div>
 <label for="dob">Date of Birth:</label>
 <input type="date" id="dob" name="dob" required>
 </div>
 </div>
 <label>Gender:</label>
 <div class="inline">
 <label><input type="radio" name="gender" value="Male"> 
Male</label>
 <label><input type="radio" name="gender" value="Female"> 
Female</label>
 <label><input type="radio" name="gender" value="Other"> 
Other</label>
 </div>
 <label for="course">Select Course:</label>
 <select id="course" name="course">
 <option value="bca">BCA</option>
 <option value="bcom">B.Com</option>
 <option value="bsc">B.Sc</option>
 <option value="ba">BA</option>
 </select>
 <label>Hobbies:</label>
 <div class="inline">
 <label><input type="checkbox" name="hobbies" value="Reading"> 
Reading</label>
 <label><input type="checkbox" name="hobbies" value="Sports"> 
Sports</label>
 <label><input type="checkbox" name="hobbies" value="Music"> 
Music</label>
 </div>
 <label for="address">Address:</label>
 <textarea id="address" name="address" rows="3" 
placeholder="Enter your address"></textarea>
 <label for="photo">Upload Photo:</label>
 <input type="file" id="photo" name="photo" accept="image/*" 
required>
 <button type="submit">Register</button>
 </form>
</body>
</html
