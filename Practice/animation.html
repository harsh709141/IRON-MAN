<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: red;
  position: fixed;
  right:0;
  bottom:0;
  animation-name: example;
  animation-duration: 4s;
  animation-direction:normal;  
}

@keyframes example {
 0%   {background-color: red; right: 0px; bottom: 0px;}
  25%  {background-color: yellow; right: 200px; bottom: 0px;}
  50%  {background-color: blue; right: 200px; bottom: 200px;}
  75%  {background-color: green; right: 0px; bottom: 200px;}
  100% {background-color: red; right: 0px; bottom: 0px;}
}
</style>
</head>
<body>

<h1>CSS Animation</h1>

<p>The animation-direction property specifies whether an animation should be played forwards, backwards or in alternate cycles. The following example will run the animation in reverse direction (backwards):</p>

<div></div>

</body>
</html>
